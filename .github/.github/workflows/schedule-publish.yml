name: Daily Trigger for Cloudflare Pages

on:
  schedule:
    - cron: '0 0 * * *' # Every day at 8:00 AM Beijing Time (0:00 UTC)
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write  # Need write permission to push commit
  issues: write    # Need write permission for posting comments

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update daily build timestamp
        run: |
          # Get current Beijing time (UTC+8)
          BUILD_DATE=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S CST')
          echo "Last build: $BUILD_DATE" > last-build.txt
          echo "Build triggered by GitHub Actions scheduled workflow." >> last-build.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push to trigger Cloudflare Pages rebuild
        run: |
          git add last-build.txt
          # Only commit if there are changes (prevents empty commits)
          git diff --staged --quiet || git commit -m "chore: daily rebuild trigger"
          git push origin main

      - name: Post publish notification to Issue #1
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/notify-publish.js
